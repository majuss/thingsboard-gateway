services:
  tb-gateway:
    image: thingsboard/tb-gateway-hardened
    container_name: tb-gateway
    restart: always

    # BACnet/IP default port. No REST/Modbus/Socket connectors in hardened build.
    ports:
      - "47808:47808/udp"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - TB_GW_HOST=host.docker.internal
      - TB_GW_PORT=1883
      - TB_GW_ACCESS_TOKEN=YOUR_ACCESS_TOKEN
      - TB_GW_LOGS_PATH=/thingsboard_gateway/logs
      - TB_GW_HARDENED=1

    # Hardening: drop all Linux caps, no privilege escalation, read-only root FS.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    tmpfs:
      - /tmp:size=16M,mode=1777

    volumes:
      - tb-gw-config:/thingsboard_gateway/config
      - tb-gw-logs:/thingsboard_gateway/logs
      - tb-gw-extensions:/thingsboard_gateway/extensions

volumes:
  tb-gw-config:
    name: tb-gw-config
  tb-gw-logs:
    name: tb-gw-logs
  tb-gw-extensions:
    name: tb-gw-extensions
